      - attributes
      properties:
        partTypeId:
          type: integer
          description: The ID of a part type from the Autocare Association's PCdb.
        attributes:
          type: array
          items:
            type: object
            required:
            - name
            - values
            properties:
              name:
                type: string
              values:
                type: array
                items:
                  type: string
    PartNumberSearchParams:
      description: 'A search parameters for the search by PartNumber.

