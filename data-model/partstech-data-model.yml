source: openapi/partstech-api-openapi.yml ($ref graph + id-reference fields across 136 component schemas)
summary: >-
  The PartsTech domain has four cores that meet in the cart: a VEHICLE core (VCdb — year/make/model/
  submodel/engine resolving to a vehicleId, also reachable by VIN or license plate), a PRODUCT core
  (PCdb taxonomy -> part type -> part -> brand, with Auto Care/AAIA brand ids), a SUPPLY core
  (supplier -> store -> live price and availability, plus a shop's supplier preferences and a supplier's
  local inventory), and a TRANSACTION core (punchout session -> cart -> quote or order -> purchased
  parts). A shop and its users sit across all four.
id_conventions:
  style: opaque integer/string ids, no prefixes
  note: >-
    PartsTech uses no typed id prefixes (nothing like ord_ / part_). Ids are bare and their meaning is
    carried only by the field name, so an agent must track which id space a value came from —
    partId, vehicleId, brandID, categoryId, partTypeId, supplierId, storeId, sellerId, shopId,
    sessionId, orderId and applicationId are all distinct spaces with no self-describing form.
  external_id_spaces:
  - name: VCdb vehicleId / yearId / makeId / modelId / subModelId / engineId / baseVehicleId
    authority: Auto Care Association Vehicle Configuration Database
  - name: PCdb categoryId / subCategoryId / partTypeId
    authority: Auto Care Association Product Classification Database
  - name: brandAAIAId
    authority: AAIA / Auto Care Association brand identifier
    seen_in: LocalInventoryItem
  - name: VIN
    authority: ISO 3779
  - name: MOTOR applicationId / operationId (taxonomyId)
    authority: MOTOR Information Systems
