          description: 'CHECK_AVAILABILITY - Part availability can be received only through ["Get Part (with request body)"](#operation/getPartWithRequestBody) with `storeId` provided. This applies to certain Tire suppliers that require branch selection.

            '
        supplier:
          $ref: '#/components/schemas/CartSearchSupplier'
        store:
          $ref: '#/components/schemas/BriefStore'
        lineCardId:
          type: integer
          example: 123
