      description.
  - operationId: searchParts
    path: POST /catalog/search
    tag: search
    replacement: not stated in the spec
    note: >-
      The primary parts search operation is marked deprecated with no named successor in the contract —
      the single most consequential deprecation on this surface.
  - operationId: getPartInterchanges
    path: GET /catalog/parts/{partId}/interchanges
    tag: parts
    replacement: not stated in the spec
  deprecated_security_scheme:
    name: apiKeyAuth
    note: >-
      The body-embedded `credentials` object is described as "a deprecated way to get access to the
      methods, used only in the methods that were in the previous version".
  gap: >-
    Three operations and one auth scheme are flagged deprecated:true in the spec, but there is no
    sunset date, no Deprecation/Sunset response header, and no published deprecation policy. An agent
    knows something is going away but not when, and for two of the three not what to use instead. No
