apis:
- name: PartsTech External API
  description: >-
    Partner-facing REST API for the PartsTech parts and tire ordering platform. Covers authentication
    (JWT bearer via /oauth/access), parts search and part detail, brands, ACES/PCdb/VCdb taxonomy
    (categories, part types, attributes, years/makes/models/submodels/engines), VIN and license plate
    decoding, quoting and line-card search, punchout and session carts, custom carts, order and partner
    order history, user/shop profile and supplier preferences, tire sizes and tire quoting, local
    inventory upload and search, EX permissions, easy registration / auto-connect, and MOTOR- and
    Mitchell 1-powered labor, maintenance schedules, fluids and specifications content. 101 operations
    across 93 paths and 136 component schemas.
