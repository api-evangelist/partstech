aid: partstech
name: PartsTech
description: >-
  PartsTech is a web-based automotive parts and tire procurement platform for repair shops, tire shops
  and dealers, connecting more than 30,000 shops to 300+ aftermarket parts and tire suppliers across
  30,000+ distribution locations through a single search, quote and ordering workflow. Founded by Greg
  Kirber and Erik St. Pierre and acquired by OEConnection (OEC) in 2025, PartsTech pairs its shop-facing
  web application with a partner-facing REST API — the PartsTech External API — used by 35+ shop
  management systems (SMS), point-of-sale and estimating vendors to embed parts search, VIN and license
  plate decoding, ACES/PCdb/VCdb taxonomy lookups, live wholesale pricing and availability, punchout
  carts, quoting, tire search, MOTOR and Mitchell 1 labor/maintenance content, order history and local
  inventory into their own software.
