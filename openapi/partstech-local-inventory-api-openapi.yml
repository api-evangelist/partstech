          description: Unique ID of item in SMS.
          type: string
        partNumber:
          type: string
        brandAAIAID:
          description: The ID of a brand from the Autocare Association. Can be got from brand object.
          type:
          - string
          - 'null'
        onHand:
          description: Current quantity in inventory.
          type: integer
        partPrice:
          description: Price for customer.
          type: number
          format: float
        partCost:
          description: Price for shop.
          type: number
          format: float
        status:
          type: string
          enum:
          - MAPPED
          - UNMAPPED
        error:
          description: Mapping error details.
          type:
          - object
          - 'null'
          required:
          - errorCode
          - message
          properties:
            errorCode:
              description: 'Error code. Describes a reason why items were not mapped.

                - NO_PARTNER_MAPPING

                - NO_SUPPLIER_MAPPING

                - NO_LINE_CODE_MAPPING

                - NO_BRAND_MAPPING

                - PART_NOT_FOUND

                - MULTIPLE_PARTS_FOUND

                - etc

                '
              type: string
            message:
              type: string
