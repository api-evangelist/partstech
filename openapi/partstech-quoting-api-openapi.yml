    ResponsePartLabor:
      title: Labor for Parts
      type: object
      required:
      - name
      - type
      - serviceType
      - laborTimeInterval
      - notes
      - taxonomy
      - additional
      - all
      - base
      - skill
      properties:
        name:
          type: string
          example: Wheel Hub And Bearing Assembly R&R Service (Front), One Side
        type:
          type: string
          example: null
        serviceType:
          type: string
          example: Service
        laborTimeInterval:
          type: string
          example: Hours
        notes:
          type: string
          example: 'Includes: The removal of component and all necessary components for access. Does not include: System diagnosis, testing, wheel alignment, or a vehicle road test.'
        taxonomy:
          type: object
          required:
          - action
          - name
          properties:
            taxonomyId:
              type:
              - integer
              - 'null'
              example: 11507
            action:
              type: string
              example: ''
            name:
              type: string
              example: Wheel Hub And Bearing Assembly R&R
        additional:
          type: object
          required:
          - laborTime
          - laborTimeDescription
          - warrantyLaborTime
          properties:
            laborTime:
              type: number
              format: float
              example: 0
            laborTimeDescription:
              type: string
              example: ''
            warrantyLaborTime:
              type: number
              format: float
              example: 0
        all:
          type: object
          required:
          - laborTime
          - laborTimeDescription
          - warrantyLaborTime
          properties:
            laborTime:
              type: number
              format: float
              example: 0
            laborTimeDescription:
              type: string
              example: ''
            warrantyLaborTime:
              type: number
              format: float
              example: 0
        base:
          type: object
          required:
          - laborTime
          - laborTimeAverage
          - laborTimeDescription
          - warrantyLaborTime
          properties:
            laborTime:
              type: number
              format: float
              example: 1.3
            laborTimeAverage:
              type: number
              format: float
              example: 0
            laborTimeDescription:
              type: string
              example: One Side
            warrantyLaborTime:
              type: number
              format: float
              example: 0
        skill:
          type: object
          required:
          - code
          - description
          - name
          properties:
            code:
              type: string
              example: g
            description:
              type: string
              example: Requires a person with limited skills and wherever simpler measuring devices are used for proper repair (Feeler Gauge, Belt Tensioner Gauge,  etc). This person must have a thorough working knowledge of the component being serviced.
            name:
              type: string
              example: General
        position:
          type:
          - object
          - 'null'
          required:
          - name
          - pcdbPositionID
          properties:
            name:
              type: string
              example: Front
            pcdbPositionID:
              type: integer
              example: 22
        attributes:
          type:
          - array
          - 'null'
          items:
            type: object
            required:
            - id
            - name
            properties:
              id:
                type: integer
                example: 6
              name:
                type: string
                example: BrakeID
